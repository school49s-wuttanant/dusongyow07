<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทะเบียนคุมหนังสือรับออนไลน์ (Hybrid Cloud)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js" type="module"></script>

    <style>
        body { font-family: 'Sarabun', 'Inter', sans-serif; background-color: #f1f5f9; }
        .modern-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .loading-spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #ffffff; border-radius: 50%; width: 18px; height: 18px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #toast { visibility: hidden; min-width: 280px; border-radius: 16px; padding: 16px; position: fixed; z-index: 100; right: 30px; top: 30px; transition: all 0.5s ease; opacity: 0; transform: translateY(-20px); }
        #toast.show { visibility: visible; opacity: 1; transform: translateY(0); }
        @media print { 
            @page { size: landscape; margin: 0.5cm; }
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            table { width: 100% !important; border: 1px solid #000 !important; border-collapse: collapse !important; table-layout: fixed; }
            th, td { border: 1px solid #333 !important; padding: 6px 4px !important; color: black !important; font-size: 11pt !important; word-wrap: break-word; }
            th:nth-child(7), td:nth-child(7) { width: 35%; }
        }
    </style>
</head>
<body class="p-4 md:p-10 text-slate-900">

    <div id="toast" class="flex items-center gap-3 text-white shadow-2xl">
        <span id="toastMessage" class="font-bold"></span>
    </div>

    <!-- Summary Modal -->
    <div id="summaryModal" class="fixed inset-0 z-[150] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl overflow-hidden transform transition-all">
                <div class="bg-indigo-600 p-8 text-white">
                    <h3 class="text-2xl font-extrabold">บันทึกเรียบร้อย</h3>
                    <p class="text-indigo-100 italic">ข้อมูลถูกส่งไปยัง Cloud (Firebase) และ Google Sheets แล้ว</p>
                </div>
                <div class="p-8 space-y-4" id="summaryContent"></div>
                <div class="p-6 bg-slate-50 flex justify-end">
                    <button onclick="document.getElementById('summaryModal').classList.add('hidden')" class="px-8 py-3 bg-slate-900 text-white font-bold rounded-2xl">ตกลง</button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-end mb-10 gap-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900">ทะเบียนหนังสือรับออนไลน์</h1>
                <p class="text-slate-500 font-medium">Hybrid Storage: Firebase (dys001) + Google Sheets</p>
            </div>
            <div class="flex gap-3 no-print">
                <button onclick="window.print()" class="px-5 py-2.5 bg-slate-900 text-white font-semibold rounded-xl shadow-lg hover:bg-slate-800 transition-all">พิมพ์รายงาน</button>
            </div>
        </div>

        <!-- Form -->
        <div id="formSection" class="modern-card p-8 rounded-3xl mb-10 no-print border-t-4 border-t-indigo-500">
            <h2 id="formTitle" class="text-xl font-bold mb-6 text-slate-800">ลงทะเบียนหนังสือใหม่</h2>
            <form id="recordForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <input type="hidden" id="docId" name="docId">
                <div class="space-y-1.5"><label class="text-sm font-bold">วันที่รับ</label><input type="date" id="date_received" name="date_received" required class="w-full p-3 border rounded-2xl"></div>
                <div class="space-y-1.5"><label class="text-sm font-bold">เลขทะเบียนรับ</label><input type="text" id="reg_no" name="reg_no" required class="w-full p-3 border rounded-2xl font-bold text-indigo-600"></div>
                <div class="space-y-1.5"><label class="text-sm font-bold">ที่ (เลขหนังสือ)</label><input type="text" id="doc_no" name="doc_no" required class="w-full p-3 border rounded-2xl"></div>
                <div class="space-y-1.5"><label class="text-sm font-bold">ลงวันที่</label><input type="date" id="doc_date" name="doc_date" required class="w-full p-3 border rounded-2xl"></div>
                <div class="space-y-1.5"><label class="text-sm font-bold">จาก</label><input type="text" id="from_dept" name="from_dept" required class="w-full p-3 border rounded-2xl"></div>
                <div class="space-y-1.5"><label class="text-sm font-bold">ถึง</label><input type="text" id="to_dept" name="to_dept" required class="w-full p-3 border rounded-2xl"></div>
                <div class="md:col-span-2 space-y-1.5"><label class="text-sm font-bold">เรื่อง</label><input type="text" id="subject" name="subject" required class="w-full p-3 border rounded-2xl"></div>
                <div class="lg:col-span-4 flex justify-end">
                    <button type="submit" id="submitBtn" class="bg-indigo-600 text-white px-10 py-3.5 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">บันทึกข้อมูล</button>
                    <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden ml-3 bg-slate-200 px-6 py-3.5 rounded-2xl font-bold">ยกเลิก</button>
                </div>
            </form>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[1000px]">
                    <thead class="bg-slate-50 text-slate-500 text-xs font-bold uppercase">
                        <tr>
                            <th class="p-5 text-center">วันที่รับ</th>
                            <th class="p-5 text-center">ทะเบียนรับ</th>
                            <th class="p-5 text-center">ที่</th>
                            <th class="p-5 text-center">ลงวันที่</th>
                            <th class="p-5">จาก</th>
                            <th class="p-5">ถึง</th>
                            <th class="p-5">เรื่อง</th>
                            <th class="p-5 text-center no-print">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm divide-y">
                        <tr><td colspan="8" class="p-10 text-center text-slate-400">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // 🔥 FIREBASE CONFIGURATION (DYS001)
        const firebaseConfig = {
            apiKey: "AIzaSyDEuaxS9dIgAb5gsa7vAPHHRQn0UTatfZI",
            authDomain: "dys001.firebaseapp.com",
            projectId: "dys001",
            storageBucket: "dys001.firebasestorage.app",
            messagingSenderId: "1013251588946",
            appId: "1:1013251588946:web:6529a0ead96c5ec70cf08b",
            measurementId: "G-MR9J0662YD"
        };

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_iEJJKdptDUKMWKRXXa-pqUT6MQnyzMIr_YSSxLohS3I5eo26WBrsoAE33yNCvy4_bA/exec";
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dys-registry-system';

        // Init Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let currentUser = null;
        let isEditing = false;
        
        // Path: /artifacts/{appId}/public/data/registrations
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'registrations');

        // Auth Flow
        const initAuth = async () => {
            try {
                await signInAnonymously(auth);
            } catch (err) {
                console.error("Auth error:", err);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadData();
            }
        });

        // Load Real-time Data
        function loadData() {
            if (!currentUser) return;
            onSnapshot(colRef, (snapshot) => {
                const data = [];
                snapshot.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
                
                // Sort Newest first in memory
                data.sort((a, b) => {
                    const numA = parseInt(a.reg_no) || 0;
                    const numB = parseInt(b.reg_no) || 0;
                    return numB - numA;
                });
                
                renderTable(data);
                if(!isEditing) generateNextRegNo(data);
            }, (error) => {
                console.error("Firestore permission or connection error:", error);
                showToast("ไม่สามารถโหลดข้อมูลได้ โปรดตรวจสอบสิทธิ์ Firestore", "bg-red-600");
            });
        }

        // Render Table UI
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="p-10 text-center text-slate-400">ยังไม่มีข้อมูลในระบบ</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(item => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-5 text-center font-medium">${item.date_received_thai || '-'}</td>
                    <td class="p-5 text-center"><span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold">${item.reg_no}</span></td>
                    <td class="p-5 text-center text-slate-500">${item.doc_no}</td>
                    <td class="p-5 text-center text-slate-500">${item.doc_date_thai || '-'}</td>
                    <td class="p-5">${item.from_dept}</td>
                    <td class="p-5">${item.to_dept}</td>
                    <td class="p-5 font-bold text-slate-800">${item.subject}</td>
                    <td class="p-5 text-center no-print">
                        <button onclick="window.editItem('${item.id}')" class="text-orange-500 font-bold hover:underline px-2">แก้ไข</button>
                    </td>
                </tr>
            `).join('');
        }

        // Auto-generate Next Registration Number
        function generateNextRegNo(data) {
            const currentYear = (new Date().getFullYear() + 543).toString();
            let maxNum = 0;
            data.forEach(item => {
                if(item.reg_no && item.reg_no.includes('/' + currentYear)) {
                    const num = parseInt(item.reg_no.split('/')[0]);
                    if(num > maxNum) maxNum = num;
                }
            });
            document.getElementById('reg_no').value = (maxNum + 1) + "/" + currentYear;
        }

        // Form Submit Handler
        document.getElementById('recordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) {
                showToast("ยังไม่ได้เข้าสู่ระบบ", "bg-red-500");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> กำลังบันทึก...';

            const formData = new FormData(e.target);
            const raw = Object.fromEntries(formData.entries());
            
            const thaiReceived = formatThaiDate(new Date(raw.date_received));
            const thaiDocDate = formatThaiDate(new Date(raw.doc_date));

            const payload = {
                ...raw,
                date_received_thai: thaiReceived,
                doc_date_thai: thaiDocDate,
                updatedAt: serverTimestamp()
            };

            try {
                // 1. Save to Firebase Firestore
                if (isEditing) {
                    await updateDoc(doc(db, colRef.path, raw.docId), payload);
                } else {
                    payload.createdAt = serverTimestamp();
                    await addDoc(colRef, payload);
                }

                // 2. Save to Google Sheets (Backup)
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        action: isEditing ? 'update_by_reg' : 'insert',
                        ...payload
                    })
                });

                showToast(isEditing ? "แก้ไขข้อมูลสำเร็จ" : "บันทึกข้อมูลสำเร็จ", "bg-emerald-500");
                showSummary(payload);
                resetForm();
            } catch (err) {
                console.error("Save error:", err);
                showToast("เกิดข้อผิดพลาดในการบันทึก", "bg-red-500");
            } finally {
                btn.disabled = false;
                btn.innerText = "บันทึกข้อมูล";
            }
        });

        // Interface functions
        window.editItem = (id) => {
            isEditing = true;
            const docRef = doc(db, colRef.path, id);
            
            // Get single data for editing
            onSnapshot(docRef, (d) => {
                if (!d.exists()) return;
                const data = d.data();
                document.getElementById('docId').value = id;
                document.getElementById('reg_no').value = data.reg_no;
                document.getElementById('doc_no').value = data.doc_no;
                document.getElementById('from_dept').value = data.from_dept;
                document.getElementById('to_dept').value = data.to_dept;
                document.getElementById('subject').value = data.subject;
                document.getElementById('date_received').value = data.date_received;
                document.getElementById('doc_date').value = data.doc_date;
                
                document.getElementById('formTitle').innerText = "📝 กำลังแก้ไขรายการ: " + data.reg_no;
                document.getElementById('cancelBtn').classList.remove('hidden');
                document.getElementById('formSection').classList.replace('border-t-indigo-500', 'border-t-orange-500');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        };

        window.resetForm = () => {
            isEditing = false;
            document.getElementById('recordForm').reset();
            document.getElementById('formTitle').innerText = "ลงทะเบียนหนังสือใหม่";
            document.getElementById('cancelBtn').classList.add('hidden');
            document.getElementById('formSection').classList.replace('border-t-orange-500', 'border-t-indigo-500');
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date_received').value = today;
            document.getElementById('doc_date').value = today;
            document.getElementById('to_dept').value = "ผู้อำนวยการ";
        };

        function formatThaiDate(date) {
            const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear() + 543}`;
        }

        function showToast(msg, colorClass) {
            const t = document.getElementById('toast');
            t.className = `flex items-center gap-3 text-white shadow-2xl p-4 rounded-xl show ${colorClass}`;
            document.getElementById('toastMessage').innerText = msg;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function showSummary(data) {
            const modal = document.getElementById('summaryModal');
            document.getElementById('summaryContent').innerHTML = `
                <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="flex justify-between"><b>เลขทะเบียน:</b> <span class="text-indigo-600">${data.reg_no}</span></p>
                    <p class="flex justify-between"><b>เลขที่หนังสือ:</b> <span>${data.doc_no}</span></p>
                    <div class="border-t pt-2">
                        <p class="text-xs text-slate-400 font-bold uppercase mb-1">เรื่อง</p>
                        <p class="text-slate-800 font-medium">${data.subject}</p>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        // Initialize Defaults
        window.resetForm();

    </script>
</body>
</html>
