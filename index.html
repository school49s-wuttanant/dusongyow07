<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทะเบียนคุมหนังสือรับออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8fafc;
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media print { 
            .no-print { display: none; }
            body { padding: 0; background-color: white; }
            .print-container { width: 100%; max-width: 100%; border: none; shadow: none; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto print-container">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-800">ทะเบียนคุมหนังสือรับออนไลน์ ปี 2569</h1>
                <p class="text-slate-500">โรงเรียนบ้านดุซงยอ</p>
            </div>
            <div class="flex gap-2 no-print">
                <button onclick="fetchData()" class="bg-blue-100 text-blue-700 hover:bg-blue-200 px-4 py-2 rounded-lg transition flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    ดึงข้อมูลล่าสุด
                </button>
                <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-2">
                    พิมพ์รายงาน
                </button>
            </div>
        </div>

        <!-- Input Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 no-print">
            <h2 class="text-lg font-semibold mb-4 text-slate-700 border-b pb-2">ลงทะเบียนหนังสือใหม่</h2>
            <form id="recordForm" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">วัน/เดือน/ปี ที่รับ</label>
                    <input type="date" id="date_received" name="date_received" required class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">เลขทะเบียนรับ</label>
                    <input type="text" id="reg_no" name="reg_no" required placeholder="เช่น 160/2569" class="w-full p-2 border border-slate-300 rounded bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">เลขที่หนังสือ (ที่)</label>
                    <input type="text" id="doc_no" name="doc_no" required placeholder="เช่น มท 0101/..." class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">ลงวันที่ (ในหนังสือ)</label>
                    <input type="date" id="doc_date" name="doc_date" required class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">จาก</label>
                    <input type="text" id="from_dept" name="from_dept" required placeholder="หน่วยงานต้นทาง" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">ถึง</label>
                    <input type="text" id="to_dept" name="to_dept" required placeholder="หน่วยงานปลายทาง" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="md:col-span-2 lg:col-span-2">
                    <label class="block text-sm font-medium text-slate-600 mb-1">เรื่อง</label>
                    <input type="text" id="subject" name="subject" required placeholder="ชื่อเรื่องหนังสือ" class="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="lg:col-start-4 flex items-end">
                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg shadow-md transition disabled:bg-slate-400">
                        <span id="btnText">บันทึกข้อมูล</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Search -->
        <div class="mb-4 no-print">
            <input type="text" id="searchTerm" onkeyup="renderTable()" placeholder="ค้นหาข้อมูล..." class="w-full p-3 border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 text-slate-700 text-xs font-bold uppercase">
                        <tr>
                            <th class="p-4 border-b text-center">วัน/เดือน/ปี ที่รับ</th>
                            <th class="p-4 border-b text-center">เลขทะเบียนรับ</th>
                            <th class="p-4 border-b text-center">ที่</th>
                            <th class="p-4 border-b text-center">ลงวันที่</th>
                            <th class="p-4 border-b text-center">จาก</th>
                            <th class="p-4 border-b text-center">ถึง</th>
                            <th class="p-4 border-b w-1/4 text-center">เรื่อง</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-sm text-slate-600 divide-y divide-slate-100">
                        <tr><td colspan="7" class="p-8 text-center text-slate-400 italic">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEryychOzbyw7xbnMABHwpmCTaIWrQiJKvt9DcuIiqSi0gTR8AQcyjEtrQMvyNa17XoA/exec"; 

        let records = [];

        async function fetchData() {
            if (!SCRIPT_URL) return;
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                records = (Array.isArray(data) ? data : []).map(row => {
                    const vals = Object.values(row);
                    return {
                        date_received: vals[0] || '-',
                        reg_no: vals[1] || '-',
                        doc_no: vals[2] || '-',
                        doc_date: vals[3] || '-',
                        from_dept: vals[4] || '-',
                        to_dept: vals[5] || '-',
                        subject: vals[6] || '-'
                    };
                }); 
                
                // คำนวณเลขทะเบียนถัดไปหลังจากได้ข้อมูล
                setNextRegNo();
                
                // กลับด้านข้อมูลเพื่อแสดงล่าสุดอยู่บน
                records = [...records].reverse();
                renderTable();
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" class="p-4 text-center text-red-500">ไม่สามารถดึงข้อมูลได้</td></tr>';
            }
        }

        const form = document.getElementById('recordForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span> กำลังบันทึก...';

            const formData = new FormData(form);
            const rawData = Object.fromEntries(formData.entries());

            const dataToSave = {
                date_received: formatThaiDateFull(rawData.date_received),
                reg_no: rawData.reg_no,
                doc_no: rawData.doc_no,
                doc_date: formatThaiDateFull(rawData.doc_date),
                from_dept: rawData.from_dept,
                to_dept: rawData.to_dept,
                subject: rawData.subject
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(dataToSave),
                    headers: { 'Content-Type': 'application/json' }
                });
                
                setTimeout(async () => {
                    alert('บันทึกข้อมูลเรียบร้อยแล้ว');
                    form.reset();
                    setDefaults(); 
                    await fetchData(); 
                }, 1000);

            } catch (error) {
                alert('เกิดข้อผิดพลาด');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = 'บันทึกข้อมูล';
            }
        });

        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            const searchTerm = document.getElementById('searchTerm').value.toLowerCase();
            
            const filtered = records.filter(r => 
                Object.values(r).some(val => String(val).toLowerCase().includes(searchTerm))
            );

            tableBody.innerHTML = filtered.map(r => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 border-b text-center font-medium text-slate-800">${formatTableDate(r.date_received)}</td>
                    <td class="p-4 border-b text-center">${r.reg_no}</td>
                    <td class="p-4 border-b text-center">${r.doc_no}</td>
                    <td class="p-4 border-b text-center">${formatTableDate(r.doc_date)}</td>
                    <td class="p-4 border-b text-center">${r.from_dept}</td>
                    <td class="p-4 border-b text-center">${r.to_dept}</td>
                    <td class="p-4 border-b font-medium text-slate-900">${r.subject}</td>
                </tr>
            `).join('');

            if (filtered.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="p-8 text-center text-slate-400">ไม่พบข้อมูล</td></tr>';
            }
        }

        // ค้นหาเลขล่าสุดและรันเลขถัดไป
        function setNextRegNo() {
            let maxNum = 159; // เริ่มที่ 159 เพื่อให้เลขถัดไปคือ 160
            const currentYear = "2569";

            records.forEach(r => {
                if (r.reg_no && typeof r.reg_no === 'string' && r.reg_no.includes('/')) {
                    const parts = r.reg_no.split('/');
                    const num = parseInt(parts[0]);
                    const year = parts[1];
                    if (!isNaN(num) && year === currentYear) {
                        if (num > maxNum) maxNum = num;
                    }
                }
            });

            const nextNo = (maxNum + 1) + "/" + currentYear;
            document.getElementById('reg_no').value = nextNo;
        }

        function formatTableDate(val) {
            if (!val || val === '-') return "-";
            if (String(val).includes('T') || (String(val).includes('-') && String(val).length > 8)) {
                return formatThaiDateFull(val);
            }
            return val;
        }

        function formatThaiDateFull(dateStr) {
            if (!dateStr || dateStr === '-') return "-";
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;

            const monthsFull = [
                "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
                "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
            ];
            
            const day = date.getDate();
            const month = monthsFull[date.getMonth()];
            let year = date.getFullYear();
            if (year < 2400) year += 543;

            return `${day} ${month} ${year}`;
        }

        function setDefaults() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date_received').value = today;
            document.getElementById('doc_date').value = today;
            document.getElementById('to_dept').value = "ผู้อำนวยการ";
            
            // ถ้ามีข้อมูลอยู่แล้วให้รันต่อ แต่ถ้ายังไม่มีหรือโหลดอยู่ให้ใช้ค่าเริ่มต้นไปก่อน
            if (records.length === 0) {
                document.getElementById('reg_no').value = "160/2569";
            } else {
                setNextRegNo();
            }
        }

        window.onload = () => {
            setDefaults();
            fetchData();
        };
    </script>
</body>
</html>
